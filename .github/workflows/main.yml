name: "Build"
on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: wimpysworld/nothing-but-nix@v10
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v15
      with:
        name: danbluhmhansen
        authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
    - run: nix build .#nixosConfigurations.mercury.config.system.build.toplevel
    - run: nix build .#nixosConfigurations.mars.config.system.build.toplevel
    - run: nix build .#nixosConfigurations.saturn.config.system.build.toplevel
