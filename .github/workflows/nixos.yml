name: "Build nixos configurations"
on:
  pull_request:
  push:
    branches:
      - dev
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: wimpysworld/nothing-but-nix@v10
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v15
      with:
        name: danbluhmhansen
        authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        extraPullNames: devenv,nix-community,helix,cachix
    - uses: ryanccn/attic-action@v0
      with:
        endpoint: ${{ secrets.ATTIC_ENDPOINT }}
        cache: ${{ secrets.ATTIC_CACHE }}
        token: ${{ secrets.ATTIC_TOKEN }}
        inputs-from: .
    - run: nix build .#nixosConfigurations.mercury.config.system.build.toplevel
    - run: nix build .#nixosConfigurations.mars.config.system.build.toplevel
    - run: nix build .#nixosConfigurations.saturn.config.system.build.toplevel
